<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nucleus</title>
    <style>
      /* Boot splash — shows immediately on load/refresh until the JS bundle
         downloads and React mounts (the first render replaces #root's
         children, so no removal code is needed). It paints before the CSS
         bundle loads, so colors here must be inlined; they mirror the brand
         tokens in src/index.css. */
      .nucleus-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
      }
      .nucleus-splash__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .nucleus-splash__logo {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        display: grid;
        place-items: center;
        color: white;
        box-shadow: 0 18px 48px -12px rgba(99, 102, 241, 0.45);
        animation: nucleus-splash-breathe 1.8s ease-in-out infinite;
      }
      .nucleus-splash__logo::before,
      .nucleus-splash__logo::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 18px;
        border: 1px solid rgba(99, 102, 241, 0.18);
        animation: nucleus-splash-ripple 1.8s ease-out infinite;
        pointer-events: none;
      }
      .nucleus-splash__logo::after {
        animation-delay: 0.9s;
      }
      .nucleus-splash__logo svg {
        width: 30px;
        height: 30px;
      }
      .nucleus-splash__title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #27272a;
      }
      .nucleus-splash__hint {
        font-size: 11px;
        color: #71717a;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .nucleus-splash__bar {
        position: relative;
        width: 180px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(24, 24, 27, 0.08);
        overflow: hidden;
      }
      .nucleus-splash__bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #6366f1 50%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: nucleus-splash-sweep 1.4s linear infinite;
      }
      @keyframes nucleus-splash-breathe {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 18px 48px -12px rgba(99, 102, 241, 0.45);
        }
        50% {
          transform: scale(1.06);
          box-shadow: 0 22px 56px -10px rgba(99, 102, 241, 0.6);
        }
      }
      @keyframes nucleus-splash-ripple {
        0% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }
      @keyframes nucleus-splash-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(180%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nucleus-splash" aria-hidden="true">
        <div class="nucleus-splash__card">
          <div class="nucleus-splash__logo">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
              <path d="M22 10v6" />
              <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
            </svg>
          </div>
          <div class="nucleus-splash__title">Nucleus</div>
          <div class="nucleus-splash__bar"></div>
          <div class="nucleus-splash__hint">Loading…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
